<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1117"><link rel=manifest href=manifest.json><title>ASS Editor</title><link rel=stylesheet href=style.css></head><body>
<header><b>ASS Editor</b><button id=bi>Import</button><button id=bv>Video</button><button id=bu title=Undo>↶</button><button id=br title=Redo>↷</button><button id=be class=p>Export</button></header>

<div id=tr><input type=range id=sk min=0 max=60 step=any value=0><span id=tm></span><i class=br></i><button id=b1>⏮</button><button id=b2>◂</button><button id=pp class=p>▶</button><button id=b3>▸</button><button id=b4>⏭</button><button id=fs title=Fullscreen>⛶</button><button id=rt>1x</button></div>
